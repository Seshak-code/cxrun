name: CI Matrix
on: [push, pull_request]

jobs:
  build_and_test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Tests
        run: cargo test
      - name: Audit Dependencies
        run: |
          cargo install cargo-audit
          cargo audit
